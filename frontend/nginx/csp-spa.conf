# Strict CSP for the React SPA (index.html + /assets). No inline or eval'd scripts.
#  - style-src 'unsafe-inline': React/framer-motion/drei <Html> write inline styles.
#  - fonts.googleapis.com / fonts.gstatic.com: web fonts (see index.html).
#  - lderdvhteofqemiivosz.supabase.co: second-tier dish/ingredient photos when a local /media file is missing.
#    Public read-only Supabase Storage objects (see IMAGE_FALLBACK_BASE_URL in WhatToCook/settings.py).
#  - blob: / data: images: fridge-scan preview (URL.createObjectURL), Vite-inlined assets, favicon.
#  - connect-src 'self': the API (incl. SSE over fetch) is same-origin behind this nginx; the scanner samples
#    are bundled locally (/samples/*.webp), so no cross-origin fetch is needed.
# frontend/vite.config.ts reads this file for `vite preview`, and e2e-csp/ fails on any violation,
# so keep it a single add_header line.
add_header Content-Security-Policy "default-src 'self'; script-src 'self'; style-src 'self' 'unsafe-inline' https://fonts.googleapis.com; font-src 'self' https://fonts.gstatic.com; img-src 'self' data: blob: https://lderdvhteofqemiivosz.supabase.co; connect-src 'self'; worker-src 'self' blob:; manifest-src 'self'; object-src 'none'; base-uri 'self'; form-action 'self'; frame-ancestors 'none'" always;
