# Strict CSP for the React SPA (index.html + /assets). No inline or eval'd scripts.
#  - style-src 'unsafe-inline': React/framer-motion/drei <Html> write inline styles.
#  - fonts.googleapis.com / fonts.gstatic.com: web fonts (see index.html).
#  - images.unsplash.com: fallback recipe photos (frontend/src/utils/imageUtils.ts, GetFood/utils.py).
#  - blob: / data: images: fridge-scan preview (URL.createObjectURL), Vite-inlined assets, favicon.
#  - connect-src 'self': the API (incl. SSE over fetch) is same-origin behind this nginx. Plus images.unsplash.com:
#    the fridge scanner's sample photos are fetch()ed and re-uploaded (FridgeScannerModal.runVisionAnalysis).
# frontend/vite.config.ts reads this file for `vite preview`, and e2e-csp/ fails on any violation,
# so keep it a single add_header line.
add_header Content-Security-Policy "default-src 'self'; script-src 'self'; style-src 'self' 'unsafe-inline' https://fonts.googleapis.com; font-src 'self' https://fonts.gstatic.com; img-src 'self' data: blob: https://images.unsplash.com; connect-src 'self' https://images.unsplash.com; worker-src 'self' blob:; manifest-src 'self'; object-src 'none'; base-uri 'self'; form-action 'self'; frame-ancestors 'none'" always;
