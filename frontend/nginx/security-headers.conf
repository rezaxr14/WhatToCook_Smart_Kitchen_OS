# Baseline response headers for EVERY location (included per location because nginx drops
# inherited add_header directives as soon as a location declares its own).
add_header X-Content-Type-Options "nosniff" always;
add_header Referrer-Policy "strict-origin-when-cross-origin" always;
add_header X-Frame-Options "DENY" always;
# camera stays same-origin only (the fridge scanner uses a file input with `capture`, not getUserMedia).
add_header Permissions-Policy "camera=(self), microphone=(), geolocation=(), payment=(), usb=(), browsing-topics=()" always;
