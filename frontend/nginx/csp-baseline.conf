# Baseline CSP for pages rendered by Django (/admin/, /legacy/, /api/docs/): they rely on inline scripts
# and a Tailwind CDN, so script/style sources are deliberately NOT restricted here; this only closes
# clickjacking, <base> hijacking, plugins and cross-origin form posts.
add_header Content-Security-Policy "base-uri 'self'; object-src 'none'; form-action 'self'; frame-ancestors 'none'" always;
