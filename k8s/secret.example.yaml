# TEMPLATE - not part of kustomization.yaml on purpose (never commit real secrets).
#
#   cp k8s/secret.example.yaml k8s/secret.yaml      # secret.yaml is git-ignored
#   $EDITOR k8s/secret.yaml
#   kubectl apply -f k8s/secret.yaml
#
# or create it directly:
#   kubectl -n whattocook create secret generic whattocook-secrets \
#     --from-literal=SECRET_KEY="$(python -c 'import secrets;print(secrets.token_urlsafe(50))')" \
#     --from-literal=POSTGRES_PASSWORD=... \
#     --from-literal=RABBITMQ_DEFAULT_USER=whattocook \
#     --from-literal=RABBITMQ_DEFAULT_PASS=... \
#     --from-literal=CELERY_BROKER_URL='amqp://whattocook:<pass>@rabbitmq:5672//' \
#     --from-literal=GEMINI_API_KEY=... \
#     --from-literal=FLOWER_BASIC_AUTH='admin:<pass>' \
#     --from-literal=GRAFANA_ADMIN_PASSWORD='<pass>' \
#     --from-literal=TELEGRAM_BOT_TOKEN=
apiVersion: v1
kind: Secret
metadata:
  name: whattocook-secrets
  namespace: whattocook
type: Opaque
stringData:
  SECRET_KEY: change-me-to-a-long-random-string
  POSTGRES_PASSWORD: change-me
  RABBITMQ_DEFAULT_USER: whattocook
  RABBITMQ_DEFAULT_PASS: change-me
  # Must embed the same RabbitMQ credentials as above (URL-encode special chars).
  CELERY_BROKER_URL: amqp://whattocook:change-me@rabbitmq:5672//
  GEMINI_API_KEY: ""
  FLOWER_BASIC_AUTH: admin:change-me # only used by optional/flower.yaml
  GRAFANA_ADMIN_PASSWORD: change-me # only used by optional/grafana.yaml
  TELEGRAM_BOT_TOKEN: ""
