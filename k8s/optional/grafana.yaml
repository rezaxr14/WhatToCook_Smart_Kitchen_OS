# OPTIONAL: Grafana with the provisioned Prometheus datasource and the "WhatToCook / Overview" dashboard.
# Not exposed through the Ingress:
#   kubectl -n whattocook port-forward svc/grafana 3000:3000   -> http://localhost:3000
#
# Needs: a Prometheus that scrapes the app (k8s/optional/servicemonitor.yaml with the Prometheus Operator, e.g.
# kube-prometheus-stack) and GRAFANA_ADMIN_PASSWORD in the whattocook-secrets Secret (see k8s/secret.example.yaml).
#
# The dashboard JSON lives in monitoring/grafana/dashboards (single source of truth, shared with docker compose), so it
# is loaded into a ConfigMap from the file instead of being copied into this YAML. Re-run this to update it:
#   kubectl -n whattocook create configmap grafana-dashboards --from-file=monitoring/grafana/dashboards \
#     --dry-run=client -o yaml | kubectl apply -f -
# Then:  kubectl apply -n whattocook -f k8s/optional/grafana.yaml
#
# Adjust the datasource `url` below to your Prometheus Service (kube-prometheus-stack default shown).
# The dashboard queries match by metric name, so they work with the Operator's job labels (web, rabbitmq, flower)
# as well as the compose ones. The Celery panels need Flower running (k8s/optional/flower.yaml).
apiVersion: v1
kind: ConfigMap
metadata:
  name: grafana-datasource
  namespace: whattocook
  labels:
    app.kubernetes.io/name: grafana
    app.kubernetes.io/part-of: whattocook
data:
  prometheus.yaml: |
    apiVersion: 1
    datasources:
      - name: Prometheus
        uid: prometheus
        type: prometheus
        access: proxy
        url: http://prometheus-operated.monitoring.svc:9090
        isDefault: true
        editable: false
        jsonData:
          httpMethod: POST
          timeInterval: 15s
---
apiVersion: v1
kind: ConfigMap
metadata:
  name: grafana-dashboard-provider
  namespace: whattocook
  labels:
    app.kubernetes.io/name: grafana
    app.kubernetes.io/part-of: whattocook
data:
  dashboards.yaml: |
    apiVersion: 1
    providers:
      - name: whattocook
        orgId: 1
        type: file
        disableDeletion: true
        allowUiUpdates: false
        updateIntervalSeconds: 30
        options:
          path: /etc/grafana/dashboards
---
apiVersion: apps/v1
kind: Deployment
metadata:
  name: grafana
  namespace: whattocook
  labels: &labels
    app.kubernetes.io/name: grafana
    app.kubernetes.io/part-of: whattocook
spec:
  replicas: 1
  selector:
    matchLabels:
      app.kubernetes.io/name: grafana
  template:
    metadata:
      labels: *labels
    spec:
      automountServiceAccountToken: false
      securityContext:
        runAsNonRoot: true
        runAsUser: 472 # the image's `grafana` user
        fsGroup: 472
        seccompProfile:
          type: RuntimeDefault
      containers:
        - name: grafana
          image: grafana/grafana:13.2.4
          ports:
            - name: http
              containerPort: 3000
          securityContext:
            allowPrivilegeEscalation: false
            capabilities:
              drop: ["ALL"]
          env:
            - name: GF_SECURITY_ADMIN_USER
              value: admin
            - name: GF_SECURITY_ADMIN_PASSWORD
              valueFrom:
                secretKeyRef: {name: whattocook-secrets, key: GRAFANA_ADMIN_PASSWORD}
            - name: GF_USERS_ALLOW_SIGN_UP
              value: "false"
            - name: GF_AUTH_ANONYMOUS_ENABLED
              value: "false"
            - name: GF_ANALYTICS_REPORTING_ENABLED
              value: "false"
            - name: GF_ANALYTICS_CHECK_FOR_UPDATES
              value: "false"
            - name: GF_DASHBOARDS_DEFAULT_HOME_DASHBOARD_PATH
              value: /etc/grafana/dashboards/whattocook-overview.json
          readinessProbe:
            httpGet: {path: /api/health, port: http}
            periodSeconds: 15
          livenessProbe:
            httpGet: {path: /api/health, port: http}
            initialDelaySeconds: 30
            periodSeconds: 30
          resources:
            requests: {cpu: 50m, memory: 128Mi}
            limits: {memory: 384Mi}
          volumeMounts:
            - {name: data, mountPath: /var/lib/grafana}
            - {name: datasource, mountPath: /etc/grafana/provisioning/datasources, readOnly: true}
            - {name: dashboard-provider, mountPath: /etc/grafana/provisioning/dashboards, readOnly: true}
            - {name: dashboards, mountPath: /etc/grafana/dashboards, readOnly: true}
      volumes:
        # Everything is provisioned from the ConfigMaps, so losing this on restart only drops ad-hoc preferences.
        - name: data
          emptyDir: {}
        - name: datasource
          configMap: {name: grafana-datasource}
        - name: dashboard-provider
          configMap: {name: grafana-dashboard-provider}
        - name: dashboards
          configMap: {name: grafana-dashboards}
---
apiVersion: v1
kind: Service
metadata:
  name: grafana
  namespace: whattocook
  labels:
    app.kubernetes.io/name: grafana
    app.kubernetes.io/part-of: whattocook
spec:
  selector:
    app.kubernetes.io/name: grafana
  ports:
    - name: http
      port: 3000
      targetPort: http
