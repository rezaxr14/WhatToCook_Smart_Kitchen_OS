# TEMPLATE (External Secrets Operator): build `whattocook-secrets` from your
# secret manager instead of kubectl. Adapt apiVersion/store to your ESO install.
apiVersion: external-secrets.io/v1
kind: ExternalSecret
metadata:
  name: whattocook-secrets
  namespace: whattocook
spec:
  refreshInterval: 1h
  secretStoreRef:
    kind: ClusterSecretStore
    name: my-secret-store
  target:
    name: whattocook-secrets
  dataFrom:
    - extract:
        key: whattocook/prod # a JSON secret holding the keys from secret.example.yaml
