# OPTIONAL: Prometheus Operator scrape configs (kube-prometheus-stack).
# Apply with:  kubectl apply -f k8s/optional/servicemonitor.yaml
# Add a `release: <your-helm-release>` label if your Prometheus selects monitors by it.
# Scrapes each pod by IP, so the Host header is `<podIP>:8000`: the web Deployment sets POD_IP and settings.py allows it (a strict ALLOWED_HOSTS
# would otherwise answer 400). The operator has no field to change Host and Prometheus reserves the header.
apiVersion: monitoring.coreos.com/v1
kind: ServiceMonitor
metadata:
  name: whattocook-api
  namespace: whattocook
spec:
  selector:
    matchLabels:
      app.kubernetes.io/name: web
  endpoints:
    - port: http
      path: /metrics
      interval: 15s
---
apiVersion: monitoring.coreos.com/v1
kind: ServiceMonitor
metadata:
  name: whattocook-rabbitmq
  namespace: whattocook
spec:
  selector:
    matchLabels:
      app.kubernetes.io/name: rabbitmq
  endpoints:
    - port: prometheus
      interval: 15s
    # Per-queue series (ai / maintenance / celery); the default endpoint only aggregates across queues.
    - port: prometheus
      path: /metrics/per-object
      interval: 15s
---
# Celery task metrics come from Flower (k8s/optional/flower.yaml). Flower 2.0.1 serves /metrics without credentials
# even when FLOWER_BASIC_AUTH is set, so no basicAuth is needed. Workers must emit events (CELERY_SEND_EVENTS, default on).
apiVersion: monitoring.coreos.com/v1
kind: ServiceMonitor
metadata:
  name: whattocook-flower
  namespace: whattocook
spec:
  selector:
    matchLabels:
      app.kubernetes.io/name: flower
  endpoints:
    - port: http
      interval: 15s
