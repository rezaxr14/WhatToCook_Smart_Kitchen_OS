# TEMPLATE for cert-manager (cluster-scoped, so intentionally not in the overlay).
#   kubectl apply -f k8s/overlays/prod/cluster-issuer.example.yaml
apiVersion: cert-manager.io/v1
kind: ClusterIssuer
metadata:
  name: letsencrypt-prod
spec:
  acme:
    server: https://acme-v02.api.letsencrypt.org/directory
    email: you@example.com
    privateKeySecretRef:
      name: letsencrypt-prod-account-key
    solvers:
      - http01:
          ingress:
            ingressClassName: nginx
