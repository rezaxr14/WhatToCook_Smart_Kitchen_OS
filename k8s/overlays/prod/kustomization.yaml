# Production-shaped overlay. Before applying:
#   1. create the `whattocook-secrets` Secret out-of-band (kubectl, Sealed Secrets or
#      External Secrets - see ../../optional/external-secret.example.yaml)
#   2. replace whattocook.example.com below and in the Ingress patch
#   3. image tags: the release workflow's `gitops-bump` pull request pins them (newTag + digest, via
#      scripts/set_image_digests.py); Argo CD (k8s/gitops/argocd) then follows this overlay on main
apiVersion: kustomize.config.k8s.io/v1beta1
kind: Kustomization

namespace: whattocook

resources:
  - ../../base
  - networkpolicy.yaml
  - postgres-backup.yaml

images:
  - name: whattocook-backend
    newName: ghcr.io/rezaxr14/whattocook-backend
    newTag: 0.0.1-rc.4
    digest: sha256:2026d380bd3bd4067ae8ee41fa19384954deb9a21798f6b6da2edf1ed61f37c0
  - name: whattocook-frontend
    newName: ghcr.io/rezaxr14/whattocook-frontend
    newTag: 0.0.1-rc.4
    digest: sha256:630c730f4c1f118c10262653b5c2973e3b84c3c5347bd16d94f2915cbc19f064

patches:
  - target:
      kind: ConfigMap
      name: whattocook-config
    patch: |-
      - op: replace
        path: /data/ALLOWED_HOSTS
        value: "whattocook.example.com,web" # "web" = kubelet probe Host header
      - op: add
        path: /data/CSRF_TRUSTED_ORIGINS
        value: "https://whattocook.example.com"
  - target:
      kind: Ingress
      name: whattocook
    patch: |-
      - op: replace
        path: /spec/rules/0/host
        value: whattocook.example.com
      - op: add
        path: /spec/tls
        value:
          - hosts: ["whattocook.example.com"]
            secretName: whattocook-tls
      - op: add
        path: /metadata/annotations/cert-manager.io~1cluster-issuer
        value: letsencrypt-prod
