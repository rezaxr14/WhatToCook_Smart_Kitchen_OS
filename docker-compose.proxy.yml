# ============================================================
# WhatToCook — personal proxy-network overrides
#
# For machines where internet egress requires the local proxy.
# Use ON TOP of the base file (never alone):
#
#   docker compose -f docker-compose.yml -f docker-compose.proxy.yml up -d --build
#
# Notes:
#   * build.args push the proxy into image builds (pip install / npm ci)
#   * environment pushes it into containers at runtime (Gemini API calls,
#     Telegram polling, seed image downloads)
#   * NO_PROXY keeps all internal service-to-service traffic direct
#   * dns servers avoid poisoned/filtered DNS on restricted networks
# ============================================================

x-proxy-build-args: &proxy-build-args
  HTTP_PROXY: http://host.docker.internal:10808
  HTTPS_PROXY: http://host.docker.internal:10808
  http_proxy: http://host.docker.internal:10808
  https_proxy: http://host.docker.internal:10808
  NO_PROXY: localhost,127.0.0.1,web,db,redis,rabbitmq,celery,celery_beat,frontend,telegram_bot
  no_proxy: localhost,127.0.0.1,web,db,redis,rabbitmq,celery,celery_beat,frontend,telegram_bot

x-proxy-env: &proxy-env
  HTTP_PROXY: http://host.docker.internal:10808
  HTTPS_PROXY: http://host.docker.internal:10808
  http_proxy: http://host.docker.internal:10808
  https_proxy: http://host.docker.internal:10808
  NO_PROXY: localhost,127.0.0.1,web,db,redis,rabbitmq,celery,celery_beat,frontend,telegram_bot,172.18.0.0/16
  no_proxy: localhost,127.0.0.1,web,db,redis,rabbitmq,celery,celery_beat,frontend,telegram_bot,172.18.0.0/16

x-extra-hosts: &extra-hosts
  extra_hosts:
    - "host.docker.internal:host-gateway"

services:
  web:
    <<: *extra-hosts
    dns:
      - 8.8.8.8
      - 1.1.1.1
    build:
      context: .
      args: *proxy-build-args
    environment:
      <<: *proxy-env

  celery:
    <<: *extra-hosts
    dns:
      - 8.8.8.8
      - 1.1.1.1
    build:
      context: .
      args: *proxy-build-args
    environment:
      <<: *proxy-env

  telegram_bot:
    <<: *extra-hosts
    dns:
      - 8.8.8.8
      - 1.1.1.1
    build:
      context: .
      args: *proxy-build-args
    environment:
      <<: *proxy-env

  frontend:
    <<: *extra-hosts
    dns:
      - 8.8.8.8
      - 1.1.1.1
    build:
      context: ./frontend
      args: *proxy-build-args
