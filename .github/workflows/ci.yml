name: CI

on:
  push:
    branches: [main, frontend_added, django-only]
  pull_request:

concurrency:
  group: ci-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

jobs:
  lint:
    name: Lint (ruff)
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-python@v6
        with:
          python-version: "3.11"
      - run: pip install ruff
      - name: ruff (syntax errors + pyflakes, see ruff.toml)
        run: ruff check .

  backend:
    name: Backend tests (${{ matrix.db }})
    runs-on: ubuntu-latest
    timeout-minutes: 15
    strategy:
      fail-fast: false
      matrix:
        db: [sqlite, postgres]
    services:
      # Started for both legs (cheap); only the `postgres` leg points Django at it.
      postgres:
        image: postgres:15-alpine
        env:
          POSTGRES_USER: whattocook
          POSTGRES_PASSWORD: ci-only-password
          POSTGRES_DB: whattocook
        ports: ["5432:5432"]
        options: >-
          --health-cmd "pg_isready -U whattocook"
          --health-interval 5s
          --health-timeout 5s
          --health-retries 10
    env:
      USE_POSTGRES: ${{ matrix.db == 'postgres' && 'true' || 'false' }}
      DB_HOST: localhost
      DB_PORT: "5432"
      POSTGRES_USER: whattocook
      POSTGRES_PASSWORD: ci-only-password
      POSTGRES_DB: whattocook
      # No RabbitMQ / Redis needed: the suite uses an in-memory cache and mocks the broker.
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-python@v6
        with:
          python-version: "3.11" # matches the Dockerfile
          cache: pip
          cache-dependency-path: requirements.txt
      - run: pip install -r requirements.txt
      - name: Django system check
        run: python manage.py check
      - name: Migrations are in sync with the models
        run: python manage.py makemigrations --check --dry-run
      - name: OpenAPI schema is valid and every route is documented
        if: matrix.db == 'sqlite'
        run: python manage.py spectacular --validate --fail-on-warn --file /tmp/openapi.yml
      - name: Test suite (with coverage)
        run: |
          pip install coverage
          coverage run manage.py test GetFood tests --verbosity 2
      - name: Coverage gate + summary
        if: matrix.db == 'sqlite'
        run: |
          echo '### Backend coverage' >> "$GITHUB_STEP_SUMMARY"
          coverage report --format=markdown >> "$GITHUB_STEP_SUMMARY" || true
          coverage report # fails below fail_under in .coveragerc

  backup-restore:
    name: Backup/restore drill (Postgres)
    runs-on: ubuntu-latest
    timeout-minutes: 10
    services:
      postgres:
        image: postgres:15-alpine
        env:
          POSTGRES_USER: whattocook
          POSTGRES_PASSWORD: ci-only-password
          POSTGRES_DB: whattocook
        ports: ["5432:5432"]
        options: >-
          --health-cmd "pg_isready -U whattocook"
          --health-interval 5s
          --health-timeout 5s
          --health-retries 10
    env:
      PGHOST: localhost
      PGPORT: "5432"
      POSTGRES_USER: whattocook
      POSTGRES_PASSWORD: ci-only-password
      POSTGRES_DB: whattocook
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-python@v6
        with:
          python-version: "3.11"
          cache: pip
          cache-dependency-path: requirements.txt
      - run: pip install -r requirements.txt
      - name: Dump with the CronJob's pipeline, restore into a fresh DB, compare
        run: bash scripts/backup-restore-drill.sh

  frontend:
    name: Frontend (typecheck + build)
    runs-on: ubuntu-latest
    timeout-minutes: 15
    defaults:
      run:
        working-directory: frontend
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-node@v6
        with:
          node-version: 20 # matches frontend/Dockerfile
          cache: npm
          cache-dependency-path: frontend/package-lock.json
      - run: npm ci
      - name: Typecheck and build
        run: npm run build
      - name: Bundle budget (no three.js in the entry graph, size limits)
        run: npm run check:bundle

  deploy-config:
    name: Compose + Kubernetes manifests
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v7
      - name: docker compose config (base, proxy override, monitoring profile)
        run: |
          cp .env.example .env
          docker compose -f docker-compose.yml config --quiet
          docker compose -f docker-compose.yml -f docker-compose.proxy.yml config --quiet
          docker compose --profile monitoring config --quiet
      - name: Render Kubernetes overlays
        run: |
          kubectl kustomize k8s/overlays/dev > rendered-dev.yaml
          kubectl kustomize k8s/overlays/prod > rendered-prod.yaml
      - name: Validate against Kubernetes + CRD schemas
        run: |
          curl -fsSL https://github.com/yannh/kubeconform/releases/latest/download/kubeconform-linux-amd64.tar.gz \
            | tar xz kubeconform
          ./kubeconform -strict -summary -kubernetes-version 1.30.0 \
            -schema-location default \
            -schema-location 'https://raw.githubusercontent.com/datreeio/CRDs-catalog/main/{{.Group}}/{{.ResourceKind}}_{{.ResourceAPIVersion}}.json' \
            rendered-dev.yaml rendered-prod.yaml \
            k8s/optional/hpa.yaml k8s/optional/flower.yaml k8s/optional/keda-celery.yaml \
            k8s/optional/servicemonitor.yaml k8s/optional/grafana.yaml k8s/secret.example.yaml \
            k8s/overlays/prod/cluster-issuer.example.yaml

  docker:
    name: Docker images build
    runs-on: ubuntu-latest
    timeout-minutes: 20
    needs: [lint, backend, backup-restore, frontend]
    steps:
      - uses: actions/checkout@v7
      - uses: docker/setup-buildx-action@v3
      - name: Build backend image
        uses: docker/build-push-action@v6
        with:
          context: .
          push: false
          load: true
          tags: whattocook-backend:ci
          cache-from: type=gha,scope=backend
          cache-to: type=gha,scope=backend,mode=max
      - name: Backend image runs as a non-root user
        run: |
          uid=$(docker run --rm --entrypoint id whattocook-backend:ci -u)
          echo "uid=$uid"
          test "$uid" = "10001"
      - name: Build frontend image
        uses: docker/build-push-action@v6
        with:
          context: frontend
          push: false
          tags: whattocook-frontend:ci
          cache-from: type=gha,scope=frontend
          cache-to: type=gha,scope=frontend,mode=max
