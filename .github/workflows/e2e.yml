name: E2E (Playwright)

# Boots Chromium + the Django API (SQLite, seeded) and runs the 23 Playwright tests.
# On pushes, PRs, nightly (catches upstream drift) and on demand.
on:
  push:
    branches: [main, frontend_added, django-only]
  pull_request:
  workflow_dispatch:
  schedule:
    - cron: "0 3 * * *"

concurrency:
  group: e2e-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

jobs:
  e2e:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    env:
      USE_POSTGRES: "false"
    steps:
      - uses: actions/checkout@v6
      - uses: actions/setup-python@v6
        with:
          python-version: "3.11"
          cache: pip
          cache-dependency-path: requirements.txt
      - run: pip install -r requirements.txt
      - name: Prepare and start the API (SQLite, seeded)
        run: |
          python manage.py migrate --noinput
          python manage.py seed_recipes
          nohup python manage.py runserver 127.0.0.1:8000 --noreload > api.log 2>&1 &
          for i in $(seq 1 40); do curl -fs http://127.0.0.1:8000/api/health/ >/dev/null && exit 0; sleep 1; done
          echo "API did not start"; cat api.log; exit 1
      - uses: actions/setup-node@v6
        with:
          node-version: 20
          cache: npm
          cache-dependency-path: frontend/package-lock.json
      - name: Install frontend + Chromium
        working-directory: frontend
        run: |
          npm ci
          npx playwright install --with-deps chromium
      - name: Run Playwright (starts Vite itself)
        working-directory: frontend
        run: npm run test:e2e
      - name: API log
        if: failure()
        run: cat api.log
      - uses: actions/upload-artifact@v4
        if: failure()
        with:
          name: playwright-artifacts
          path: |
            frontend/test-results/
            frontend/playwright-report/
          if-no-files-found: ignore
