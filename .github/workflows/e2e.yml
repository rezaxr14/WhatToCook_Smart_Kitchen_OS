name: E2E (Playwright)

# Boots Chromium + the Django API (SQLite, seeded) and runs the 23 Playwright tests (Vite dev server),
# then the CSP suite (frontend/e2e-csp) against the production build with nginx's exact Content-Security-Policy.
# On pushes, PRs, nightly (catches upstream drift) and on demand.
on:
  push:
    branches: [main, frontend_added, django-only]
  pull_request:
  workflow_dispatch:
  schedule:
    - cron: "0 3 * * *"

concurrency:
  group: e2e-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

jobs:
  e2e:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    env:
      USE_POSTGRES: "false"
    steps:
      - uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803 # v6.1.0
      - uses: actions/setup-python@ece7cb06caefa5fff74198d8649806c4678c61a1 # v6.3.0
        with:
          python-version: "3.11"
          cache: pip
          cache-dependency-path: requirements.txt
      - run: pip install -r requirements.txt
      - name: Prepare and start the API (SQLite, seeded)
        run: |
          python manage.py migrate --noinput
          python manage.py seed_recipes
          nohup python manage.py runserver 127.0.0.1:8000 --noreload > api.log 2>&1 &
          for i in $(seq 1 40); do curl -fs http://127.0.0.1:8000/api/health/ >/dev/null && exit 0; sleep 1; done
          echo "API did not start"; cat api.log; exit 1
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version: 24
          cache: npm
          cache-dependency-path: frontend/package-lock.json
      - name: Install frontend + Chromium
        working-directory: frontend
        run: |
          npm ci
          npx playwright install --with-deps chromium
      - name: Run Playwright (starts Vite itself)
        working-directory: frontend
        run: npm run test:e2e
      - name: Playwright against the production build under the real CSP
        working-directory: frontend
        run: npm run test:e2e:csp
      - name: API log
        if: failure()
        run: cat api.log
      - uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4.6.2
        if: failure()
        with:
          name: playwright-artifacts
          path: |
            frontend/test-results/
            frontend/playwright-report/
          if-no-files-found: ignore
