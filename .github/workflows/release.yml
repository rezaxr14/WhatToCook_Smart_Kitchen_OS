name: Release images

# Push a tag like v1.0.0 to publish ghcr.io/<owner>/whattocook-backend and -frontend, for linux/amd64 and linux/arm64.
# Each image is: built locally for BOTH architectures and scanned BEFORE anything is published (HIGH/CRITICAL fixable CVEs
# fail the release), published as one multi-arch index with an SBOM (SPDX) and SLSA provenance attestation, signed keylessly
# with cosign, and the signature is verified right after signing. Verify as a consumer: see "Supply chain" in the README.
# Then, for tag pushes, the gitops-bump job opens a pull request that pins k8s/overlays/prod to the new tag + digest; merging it
# is the deployment (Argo CD, k8s/gitops/argocd).
# Pull access follows the repository's visibility (make the packages public in
# GitHub -> Packages if you want anonymous pulls).
on:
  push:
    tags: ["v*.*.*"]
  workflow_dispatch:

permissions:
  contents: read
  packages: write
  id-token: write # keyless cosign signing: GitHub's OIDC identity is the signing identity (no keys to store)

jobs:
  publish:
    runs-on: ubuntu-latest
    timeout-minutes: 60 # the arm64 build runs under QEMU emulation
    strategy:
      fail-fast: false
      matrix:
        include:
          - name: backend
            context: .
            no-cache-filters: ""
          - name: frontend
            context: frontend
            no-cache-filters: serve # re-run `apk upgrade` on every scan
    steps:
      - uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803 # v6.1.0
      - name: Lowercase the registry namespace
        run: echo "OWNER=${GITHUB_REPOSITORY_OWNER,,}" >> "$GITHUB_ENV"
      # Emulation for the arm64 build only (amd64 is native). The action runs this image with --privileged on the runner, so it is
      # pinned by digest (the index digest of tonistiigi/binfmt:latest, resolved 2026-10-21). Dependabot does not read an action's
      # `image:` input: bump it by hand with
      #   docker buildx imagetools inspect tonistiigi/binfmt:latest | awk '/^Digest:/ {print $2; exit}'
      - uses: docker/setup-qemu-action@99012661954931238ded8c8b007157a8430204e1 # v4.4.0
        with:
          platforms: arm64
          image: docker.io/tonistiigi/binfmt@sha256:400a4873b838d1b89194d982c45e5fb3cda4593fbfd7e08a02e76b03b21166f0
      - uses: docker/setup-buildx-action@8d2750c68a42422c14e847fe6c8ac0403b4cbd6f # v3.12.0
      - uses: docker/login-action@c94ce9fb468520275223c153574b00df6fe4bcc9 # v3.7.0
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}
      - id: meta
        uses: docker/metadata-action@c299e40c65443455700f0fdfc63efafe5b349051 # v5.10.0
        with:
          images: ghcr.io/${{ env.OWNER }}/whattocook-${{ matrix.name }}
          tags: |
            type=semver,pattern={{version}}
            type=semver,pattern={{major}}.{{minor}}
            type=sha
            type=raw,value=latest,enable=${{ startsWith(github.ref, 'refs/tags/') }}
      - name: Build the linux/amd64 image locally (not pushed) so it can be scanned first
        uses: docker/build-push-action@10e90e3645eae34f1e60eeb005ba3a3d33f178e8 # v6.19.2
        with:
          context: ${{ matrix.context }}
          platforms: linux/amd64
          load: true
          push: false
          tags: whattocook-${{ matrix.name }}:scan
          no-cache-filters: ${{ matrix.no-cache-filters }}
          cache-from: type=gha,scope=${{ matrix.name }}
          cache-to: type=gha,scope=${{ matrix.name }},mode=max
      - name: Scan the amd64 image (a fixable HIGH/CRITICAL vulnerability stops the release before anything is published)
        uses: ./.github/actions/scan-image
        with:
          image-ref: whattocook-${{ matrix.name }}:scan
      # The arm64 image has its own architecture-specific wheels and libraries, so it is scanned too. Its own cache scope: two
      # builds exporting to one scope would overwrite each other's index.
      - name: Build the linux/arm64 image locally (not pushed) so it can be scanned first
        uses: docker/build-push-action@10e90e3645eae34f1e60eeb005ba3a3d33f178e8 # v6.19.2
        with:
          context: ${{ matrix.context }}
          platforms: linux/arm64
          load: true
          push: false
          tags: whattocook-${{ matrix.name }}:scan-arm64
          no-cache-filters: ${{ matrix.no-cache-filters }}
          cache-from: type=gha,scope=${{ matrix.name }}-arm64
          cache-to: type=gha,scope=${{ matrix.name }}-arm64,mode=max
      - name: Scan the arm64 image (same gate, nothing is published before both architectures pass)
        uses: ./.github/actions/scan-image
        with:
          image-ref: whattocook-${{ matrix.name }}:scan-arm64
      - name: Publish the multi-arch image with SBOM and provenance attestations
        id: build
        uses: docker/build-push-action@10e90e3645eae34f1e60eeb005ba3a3d33f178e8 # v6.19.2
        with:
          context: ${{ matrix.context }}
          platforms: linux/amd64,linux/arm64
          push: true
          tags: ${{ steps.meta.outputs.tags }}
          labels: ${{ steps.meta.outputs.labels }}
          sbom: true # SPDX SBOM attached to the image as an attestation
          provenance: mode=max # SLSA build provenance
          # Reuses the layers the two scanned builds produced, so what is published is what was scanned.
          cache-from: |
            type=gha,scope=${{ matrix.name }}
            type=gha,scope=${{ matrix.name }}-arm64
          cache-to: type=gha,scope=${{ matrix.name }},mode=max
      - uses: sigstore/cosign-installer@6f9f17788090df1f26f669e9d70d6ae9567deba6 # v4.1.2
        with:
          cosign-release: v3.1.3 # the installer's own default is older; pin the tool, not just the action
      - name: Sign the image (keyless) and verify the signature
        env:
          IMAGE: ghcr.io/${{ env.OWNER }}/whattocook-${{ matrix.name }}
          DIGEST: ${{ steps.build.outputs.digest }}
        run: |
          # Sign the digest, never a tag: tags move, digests do not.
          cosign sign --yes "${IMAGE}@${DIGEST}"
          # Prove it verifies against THIS workflow's identity before calling the release done.
          cosign verify "${IMAGE}@${DIGEST}" \
            --certificate-identity "https://github.com/${GITHUB_WORKFLOW_REF}" \
            --certificate-oidc-issuer https://token.actions.githubusercontent.com
      - name: Confirm both architectures are in the published image
        env:
          IMAGE: ghcr.io/${{ env.OWNER }}/whattocook-${{ matrix.name }}
          DIGEST: ${{ steps.build.outputs.digest }}
        run: |
          # Attestation manifests appear in the index as os/architecture "unknown": only real linux platforms count.
          docker buildx imagetools inspect "${IMAGE}@${DIGEST}" --raw \
            | jq -e '[.manifests[].platform | select(.os == "linux") | .architecture] | (index("amd64") != null) and (index("arm64") != null)' >/dev/null \
            || { echo "${IMAGE}@${DIGEST} does not contain both linux/amd64 and linux/arm64"; exit 1; }
          echo "linux/amd64 and linux/arm64 present in ${IMAGE}@${DIGEST}"
      - name: Confirm the attestations are attached to the published image
        env:
          IMAGE: ghcr.io/${{ env.OWNER }}/whattocook-${{ matrix.name }}
          DIGEST: ${{ steps.build.outputs.digest }}
        run: |
          docker buildx imagetools inspect "${IMAGE}@${DIGEST}" --raw | grep -q 'attestation-manifest' \
            || { echo "no attestation manifest on ${IMAGE}@${DIGEST}"; exit 1; }
          docker buildx imagetools inspect "${IMAGE}@${DIGEST}" --format '{{ json .SBOM }}' | grep -q spdxVersion \
            || { echo "no SPDX SBOM on ${IMAGE}@${DIGEST}"; exit 1; }
          echo "SBOM and provenance attestations present on ${IMAGE}@${DIGEST}"

  # Propose the release to the GitOps overlay. Tag pushes only: a manual run from a branch has no release version to deploy.
  # It opens a PULL REQUEST (never pushes to main): merging it is the deployment, and the PR is where a human can say no.
  # Only digests whose cosign signature verifies against THIS workflow's identity are ever written to git.
  gitops-bump:
    name: Propose the release to the GitOps overlay
    needs: publish
    if: startsWith(github.ref, 'refs/tags/v')
    runs-on: ubuntu-latest
    timeout-minutes: 10
    concurrency:
      group: gitops-bump
      cancel-in-progress: false
    permissions:
      contents: write # push the bump branch
      pull-requests: write # open the pull request
      packages: read # resolve the published digests (no id-token: verifying a signature needs no identity of our own)
    steps:
      # Pull requests opened with the default GITHUB_TOKEN do not start other workflows (GitHub's rule), so CI would not run on the
      # bump. Add a GITOPS_TOKEN secret (fine-grained PAT or GitHub App token with contents + pull-requests write) to get CI on it.
      - uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803 # v6.1.0
        with:
          ref: main
          token: ${{ secrets.GITOPS_TOKEN || github.token }}
      - name: Lowercase the registry namespace
        run: echo "OWNER=${GITHUB_REPOSITORY_OWNER,,}" >> "$GITHUB_ENV"
      - uses: docker/login-action@c94ce9fb468520275223c153574b00df6fe4bcc9 # v3.7.0
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}
      - uses: sigstore/cosign-installer@6f9f17788090df1f26f669e9d70d6ae9567deba6 # v4.1.2
        with:
          cosign-release: v3.1.3
      - name: Resolve the released digests and verify their signatures
        run: |
          VERSION="${GITHUB_REF_NAME#v}"
          for name in backend frontend; do
            image="ghcr.io/${OWNER}/whattocook-${name}"
            digest="$(docker buildx imagetools inspect "${image}:${VERSION}" | awk '/^Digest:/ {print $2; exit}')"
            [[ "$digest" =~ ^sha256:[0-9a-f]{64}$ ]] || { echo "could not resolve the digest of ${image}:${VERSION} (got '${digest}')"; exit 1; }
            # The same check the publish job ran: only an image this workflow signed may be deployed.
            cosign verify "${image}@${digest}" \
              --certificate-identity "https://github.com/${GITHUB_WORKFLOW_REF}" \
              --certificate-oidc-issuer https://token.actions.githubusercontent.com > /dev/null
            echo "${name^^}_DIGEST=${digest}" >> "$GITHUB_ENV"
            echo "${image}:${VERSION} -> ${digest} (signature verified)"
          done
          echo "VERSION=${VERSION}" >> "$GITHUB_ENV"
      - name: Pin k8s/overlays/prod to this release
        run: python3 scripts/set_image_digests.py --version "$VERSION" --backend "$BACKEND_DIGEST" --frontend "$FRONTEND_DIGEST"
      - name: Open the pull request
        env:
          GH_TOKEN: ${{ secrets.GITOPS_TOKEN || github.token }}
        run: |
          if git diff --quiet; then
            echo "k8s/overlays/prod already pins ${VERSION}: nothing to propose"
            exit 0
          fi
          BRANCH="gitops/release-${VERSION}"
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git switch -c "$BRANCH"
          git add k8s/overlays/prod/kustomization.yaml
          git commit -m "chore(release): deploy ${VERSION} (backend ${BACKEND_DIGEST:0:19}, frontend ${FRONTEND_DIGEST:0:19})"
          git push --force origin "HEAD:refs/heads/${BRANCH}"
          if gh pr view "$BRANCH" --json state --jq .state 2>/dev/null | grep -q OPEN; then
            echo "a pull request for ${BRANCH} is already open"
            exit 0
          fi
          {
            echo "Pins \`k8s/overlays/prod\` to release **${VERSION}**. **Merging this deploys it** (Argo CD follows \`main\`)."
            echo
            echo "| image | digest |"
            echo "|---|---|"
            echo "| backend | \`${BACKEND_DIGEST}\` |"
            echo "| frontend | \`${FRONTEND_DIGEST}\` |"
            echo
            echo "Both digests were resolved from the published tags and their cosign signatures verified against the release workflow's identity before this branch was pushed."
            echo "Built by ${GITHUB_SERVER_URL}/${GITHUB_REPOSITORY}/actions/runs/${GITHUB_RUN_ID}"
          } > pr-body.md
          gh pr create --base main --head "$BRANCH" --title "chore(release): deploy ${VERSION}" --body-file pr-body.md
