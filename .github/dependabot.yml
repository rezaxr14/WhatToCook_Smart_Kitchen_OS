version: 2
updates:
  - package-ecosystem: pip
    directory: /
    schedule:
      interval: weekly
    groups:
      python-minor-and-patch:
        update-types: [minor, patch]
  - package-ecosystem: npm
    directory: /frontend
    schedule:
      interval: weekly
    groups:
      npm-minor-and-patch:
        update-types: [minor, patch]
    ignore:
      # @types/node follows the Node major the image and CI run: one decision, taken together (docs/ROADMAP.md item 12).
      - dependency-name: "@types/node"
        update-types: ["version-update:semver-major"]
  - package-ecosystem: github-actions
    # The local composite action (.github/actions/scan-image) pins trivy-action by SHA too; Dependabot only looks at
    # .github/workflows unless told about it. (The scanner *version* input is bumped by hand, see that action.)
    directories:
      - /
      - /.github/actions/*
    schedule:
      interval: weekly
  - package-ecosystem: docker
    directory: /
    schedule:
      interval: weekly
  - package-ecosystem: docker
    directory: /frontend
    schedule:
      interval: weekly
    ignore:
      # A Node major is a deliberate bump: the image, the four setup-node pins and @types/node move together, and
      # tests/test_frontend_deps.py fails a PR that moves only one of them. Minor/patch and digest updates still arrive.
      - dependency-name: node
        update-types: ["version-update:semver-major"]
  - package-ecosystem: docker-compose
    directory: /
    schedule:
      interval: weekly
    ignore:
      # Pinned to 4.2 on purpose: 4.3+ rejects the queues Celery 5.5's kombu
      # declares. Bump together with a Celery/kombu upgrade, not automatically.
      - dependency-name: rabbitmq
