# ============================================================
# WhatToCook — base stack (works on any direct-internet machine)
#
#   docker compose up -d --build
#
# Behind a forced HTTP proxy? Add your network overrides on top:
#   docker compose -f docker-compose.yml -f docker-compose.proxy.yml up -d --build
# ============================================================

x-backend-common: &backend-common
  build:
    context: .
  image: whattocook-backend:latest
  env_file:
    - path: .env
      required: false # optional: every setting has a working default
  environment:
    DJANGO_SETTINGS_MODULE: WhatToCook.settings
    PYTHONUNBUFFERED: "1"
    PYTHONDONTWRITEBYTECODE: "1"
    # Inside this network we always talk to the postgres service:
    USE_POSTGRES: "true"
    DB_HOST: db
    DB_PORT: "5432"
    # RabbitMQ is the Celery message broker; Redis keeps results + Django cache.
    CELERY_BROKER_URL: amqp://${RABBITMQ_DEFAULT_USER:-whattocook}:${RABBITMQ_DEFAULT_PASS:-secret}@rabbitmq:5672//
    CELERY_RESULT_BACKEND: redis://redis:6379/0
    REDIS_URL: redis://redis:6379/1

services:
  web:
    <<: *backend-common
    container_name: whattocook_web
    command: ["web"]
    ports:
      - "8000:8000"
    volumes:
      - media_data:/app/media
    depends_on:
      db:
        condition: service_healthy
      redis:
        condition: service_healthy
      rabbitmq:
        condition: service_healthy
    restart: unless-stopped

  frontend:
    build:
      context: ./frontend
    image: whattocook-frontend:latest
    container_name: whattocook_frontend
    ports:
      - "4173:80"
    depends_on:
      web:
        condition: service_healthy
    restart: unless-stopped

  db:
    image: postgres:15-alpine
    container_name: whattocook_db
    env_file:
      - path: .env
        required: false
    environment:
      POSTGRES_USER: ${POSTGRES_USER:-whattocook}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:-secret}
      POSTGRES_DB: ${POSTGRES_DB:-whattocook}
    volumes:
      - db_data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U $${POSTGRES_USER:-whattocook} -d $${POSTGRES_DB:-whattocook}"]
      interval: 5s
      timeout: 5s
      retries: 10
      start_period: 10s
    restart: unless-stopped

  redis:
    image: redis:7-alpine
    container_name: whattocook_redis
    # Ephemeral cache + Celery result store is fine: results are advisory,
    # durable data lives in Postgres. (The task queue itself lives in RabbitMQ.)
    command: ["redis-server", "--maxmemory", "64mb", "--maxmemory-policy", "allkeys-lru", "--save", ""]
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 5s
      timeout: 3s
      retries: 10
    restart: unless-stopped

  rabbitmq:
    # Pinned to 4.2: RabbitMQ 4.3+ rejects the transient non-exclusive queues
    # that Celery 5.5's kombu declares for worker control (pidbox).
    # Bump only together with a Celery/kombu upgrade.
    image: rabbitmq:4.2-management-alpine
    container_name: whattocook_rabbitmq
    hostname: rabbitmq
    environment:
      RABBITMQ_DEFAULT_USER: ${RABBITMQ_DEFAULT_USER:-whattocook}
      RABBITMQ_DEFAULT_PASS: ${RABBITMQ_DEFAULT_PASS:-secret}
    ports:
      # Management UI, bound to localhost only. AMQP (5672) stays internal.
      - "127.0.0.1:15672:15672"
      # Built-in Prometheus plugin (metrics), localhost only.
      - "127.0.0.1:15692:15692"
    volumes:
      - rabbitmq_data:/var/lib/rabbitmq
    healthcheck:
      test: ["CMD", "rabbitmq-diagnostics", "-q", "ping"]
      interval: 10s
      timeout: 10s
      retries: 10
      start_period: 30s
    restart: unless-stopped

  celery:
    <<: *backend-common
    container_name: whattocook_celery
    command: ["celery"]
    # The image's HTTP healthcheck only fits the web role. `disable: true` makes newer
    # Compose releases fail `up --wait` ("has no healthcheck configured"), so each
    # non-HTTP role gets a real check instead: here, a Celery control-channel ping.
    healthcheck:
      test: ["CMD-SHELL", "python -m celery -A WhatToCook inspect ping -d celery@$$HOSTNAME --timeout 5"]
      interval: 45s
      timeout: 15s
      retries: 3
      start_period: 40s
    depends_on:
      db:
        condition: service_healthy
      redis:
        condition: service_healthy
      rabbitmq:
        condition: service_healthy
    restart: unless-stopped

  celery_beat:
    # Periodic tasks (nightly AI-cache cleanup). Exactly one instance may run.
    <<: *backend-common
    container_name: whattocook_celery_beat
    command: ["beat"]
    healthcheck:
      # The entrypoint exec()s the scheduler, so PID 1 must be the beat process.
      # (Crashes are handled by the restart policy; this keeps `up --wait` honest.)
      test: ["CMD", "python", "-c", "import sys; sys.exit(0 if b'beat' in open('/proc/1/cmdline', 'rb').read() else 1)"]
      interval: 30s
      timeout: 5s
      retries: 3
      start_period: 30s
    depends_on:
      db:
        condition: service_healthy
      rabbitmq:
        condition: service_healthy
    restart: unless-stopped

  # --- Optional monitoring stack:  docker compose --profile monitoring up -d --------
  flower:
    # Live view of workers, tasks and queues (http://localhost:5555).
    profiles: ["monitoring"]
    image: mher/flower:2.0.1
    container_name: whattocook_flower
    environment:
      CELERY_BROKER_URL: amqp://${RABBITMQ_DEFAULT_USER:-whattocook}:${RABBITMQ_DEFAULT_PASS:-secret}@rabbitmq:5672//
      FLOWER_BROKER_API: http://${RABBITMQ_DEFAULT_USER:-whattocook}:${RABBITMQ_DEFAULT_PASS:-secret}@rabbitmq:15672/api/
      FLOWER_BASIC_AUTH: ${FLOWER_BASIC_AUTH:-admin:change-me}
    ports:
      - "127.0.0.1:5555:5555"
    depends_on:
      rabbitmq:
        condition: service_healthy
    restart: unless-stopped

  prometheus:
    # Scrapes the API (/metrics), RabbitMQ (:15692) and Flower. UI: http://localhost:9090
    profiles: ["monitoring"]
    image: prom/prometheus:v3.5.0
    container_name: whattocook_prometheus
    volumes:
      - ./monitoring/prometheus.yml:/etc/prometheus/prometheus.yml:ro
      - prometheus_data:/prometheus
    ports:
      - "127.0.0.1:9090:9090"
    restart: unless-stopped

  grafana:
    # Dashboards over Prometheus. UI: http://localhost:3000 (login: GRAFANA_ADMIN_USER / GRAFANA_ADMIN_PASSWORD).
    # The datasource and the "WhatToCook / Overview" dashboard are provisioned from ./monitoring/grafana (read-only):
    # change the JSON, not the UI.
    profiles: ["monitoring"]
    image: grafana/grafana:13.2.4
    container_name: whattocook_grafana
    environment:
      GF_SECURITY_ADMIN_USER: ${GRAFANA_ADMIN_USER:-admin}
      GF_SECURITY_ADMIN_PASSWORD: ${GRAFANA_ADMIN_PASSWORD:-change-me}
      GF_USERS_ALLOW_SIGN_UP: "false"
      GF_AUTH_ANONYMOUS_ENABLED: "false"
      GF_ANALYTICS_REPORTING_ENABLED: "false"
      GF_ANALYTICS_CHECK_FOR_UPDATES: "false"
      GF_DASHBOARDS_DEFAULT_HOME_DASHBOARD_PATH: /etc/grafana/dashboards/whattocook-overview.json
    volumes:
      - ./monitoring/grafana/provisioning:/etc/grafana/provisioning:ro
      - ./monitoring/grafana/dashboards:/etc/grafana/dashboards:ro
      - grafana_data:/var/lib/grafana
    ports:
      - "127.0.0.1:3000:3000"
    healthcheck:
      test: ["CMD-SHELL", "wget -qO- http://localhost:3000/api/health | grep -q '\"database\": \"ok\"'"]
      interval: 15s
      timeout: 5s
      retries: 5
      start_period: 20s
    depends_on:
      - prometheus
    restart: unless-stopped

  telegram_bot:
    <<: *backend-common
    container_name: whattocook_telegram_bot
    command: ["bot"]
    healthcheck:
      # PID 1 is the bot (`run_telegram_bot`) or, with an empty token, the idle entrypoint shell.
      test: ["CMD", "python", "-c", "import sys; c = open('/proc/1/cmdline', 'rb').read(); sys.exit(0 if (b'run_telegram_bot' in c or b'entrypoint.sh' in c) else 1)"]
      interval: 30s
      timeout: 5s
      retries: 3
      start_period: 30s
    depends_on:
      db:
        condition: service_healthy
      redis:
        condition: service_healthy
    restart: unless-stopped

volumes:
  db_data:
  media_data:
  rabbitmq_data:
  prometheus_data:
  grafana_data:
